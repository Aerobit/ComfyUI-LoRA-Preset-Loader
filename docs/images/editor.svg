<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 846" width="940" height="846" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">LoRA Preset Loader: the preset editor</title>
<desc id="d">Illustration of the preset editor dialog with numbered parts: saved preset picker, name, rows with on switch, LoRA file, model and CLIP strengths, reorder and remove buttons, notes, status line, delete and save.</desc>
<rect x="10" y="10" width="920" height="826" rx="14" fill="#1b2027" stroke="#47515f"/><text x="44" y="68" font-size="23" fill="#edf0f4" font-weight="650">LoRA presets</text><text x="44" y="90" font-size="13" fill="#aeb8c6" >Save a style once. Choose it whenever you need it.</text><g opacity="1"><rect x="826" y="44" width="70" height="36" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="861" y="67" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">Close</text></g><text x="44" y="124" font-size="12" fill="#bdc8d8" font-weight="600">Saved preset</text><rect x="44" y="132" width="540" height="40" rx="7" fill="#10161e" stroke="#445060"/><text x="54" y="157" font-size="14" fill="#edf0f4" >Cinematic</text><path d="M562 149 l5 6 l5 -6" fill="none" stroke="#aeb8c6" stroke-width="1.6"/><g opacity="1"><rect x="598" y="132" width="120" height="40" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="658" y="157" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">New preset</text></g><g opacity="1"><rect x="730" y="132" width="80" height="40" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="770" y="157" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">Reload</text></g><text x="44" y="200" font-size="12" fill="#bdc8d8" font-weight="600">Preset name</text><rect x="44" y="208" width="852" height="40" rx="7" fill="#10161e" stroke="#445060"/><text x="54" y="233" font-size="14" fill="#edf0f4" >Cinematic</text><text x="44" y="274" font-size="13" fill="#aeb8c6" >Adjust each LoRA separately. Use its − / + controls for 0.1 steps, or click the number to enter an exact strength such as 0.75.</text><text x="44" y="294" font-size="13" fill="#aeb8c6" >CLIP strengths apply only when this node's CLIP input is connected. They stay saved when you use MODEL only.</text><g opacity="1"><rect x="30" y="312" width="880" height="82" rx="9" fill="#222a35" stroke="#3a4655"/><text x="44" y="336" font-size="12" fill="#bdc8d8" font-weight="600">On</text><rect x="44" y="346" width="20" height="20" rx="4" fill="#78beaa" stroke="#78beaa"/><path d="M48 356 l4 5 l8 -10" fill="none" stroke="#10241d" stroke-width="2.2"/><text x="84" y="336" font-size="12" fill="#bdc8d8" font-weight="600">LoRA 1</text><rect x="84" y="344" width="340" height="40" rx="7" fill="#10161e" stroke="#445060"/><text x="94" y="369" font-size="14" fill="#edf0f4" >styles/cinematic-film.safetensors</text><path d="M402 361 l5 6 l5 -6" fill="none" stroke="#aeb8c6" stroke-width="1.6"/><text x="438" y="336" font-size="12" fill="#bdc8d8" font-weight="600">Model strength</text><rect x="438" y="344" width="150" height="42" rx="12" fill="#2b414f"/><text x="454" y="372" font-size="24" fill="#a4b0b7" >−</text><text x="482" y="371" font-size="16" fill="#f3f5f6" font-variant-numeric="tabular-nums">0.80</text><text x="564" y="372" font-size="24" fill="#a4b0b7" >+</text><text x="602" y="336" font-size="12" fill="#bdc8d8" font-weight="600">CLIP strength</text><rect x="602" y="344" width="150" height="42" rx="12" fill="#2b414f"/><text x="618" y="372" font-size="24" fill="#a4b0b7" >−</text><text x="646" y="371" font-size="16" fill="#f3f5f6" font-variant-numeric="tabular-nums">0.60</text><text x="728" y="372" font-size="24" fill="#a4b0b7" >+</text><g opacity="0.4"><rect x="768" y="344" width="34" height="40" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="785" y="369" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">↑</text></g><g opacity="1"><rect x="806" y="344" width="34" height="40" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="823" y="369" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">↓</text></g><g opacity="1"><rect x="844" y="344" width="34" height="40" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="861" y="369" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">×</text></g></g><g opacity="0.65"><rect x="30" y="404" width="880" height="82" rx="9" fill="#222a35" stroke="#3a4655"/><text x="44" y="428" font-size="12" fill="#bdc8d8" font-weight="600">On</text><rect x="44" y="438" width="20" height="20" rx="4" fill="#10161e" stroke="#445060"/><text x="84" y="428" font-size="12" fill="#bdc8d8" font-weight="600">LoRA 2</text><rect x="84" y="436" width="340" height="40" rx="7" fill="#10161e" stroke="#445060"/><text x="94" y="461" font-size="14" fill="#edf0f4" >detail/skin-texture-xl.safetensors</text><path d="M402 453 l5 6 l5 -6" fill="none" stroke="#aeb8c6" stroke-width="1.6"/><text x="438" y="428" font-size="12" fill="#bdc8d8" font-weight="600">Model strength</text><rect x="438" y="436" width="150" height="42" rx="12" fill="#2b414f"/><text x="454" y="464" font-size="24" fill="#a4b0b7" >−</text><text x="482" y="463" font-size="16" fill="#f3f5f6" font-variant-numeric="tabular-nums">0.75</text><text x="564" y="464" font-size="24" fill="#a4b0b7" >+</text><text x="602" y="428" font-size="12" fill="#bdc8d8" font-weight="600">CLIP strength</text><rect x="602" y="436" width="150" height="42" rx="12" fill="#2b414f"/><text x="618" y="464" font-size="24" fill="#a4b0b7" >−</text><text x="646" y="463" font-size="16" fill="#f3f5f6" font-variant-numeric="tabular-nums">0.50</text><text x="728" y="464" font-size="24" fill="#a4b0b7" >+</text><g opacity="1"><rect x="768" y="436" width="34" height="40" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="785" y="461" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">↑</text></g><g opacity="1"><rect x="806" y="436" width="34" height="40" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="823" y="461" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">↓</text></g><g opacity="1"><rect x="844" y="436" width="34" height="40" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="861" y="461" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">×</text></g></g><g opacity="1"><rect x="30" y="496" width="880" height="82" rx="9" fill="#222a35" stroke="#d58c77"/><text x="44" y="520" font-size="12" fill="#bdc8d8" font-weight="600">On</text><rect x="44" y="530" width="20" height="20" rx="4" fill="#78beaa" stroke="#78beaa"/><path d="M48 540 l4 5 l8 -10" fill="none" stroke="#10241d" stroke-width="2.2"/><text x="84" y="520" font-size="12" fill="#bdc8d8" font-weight="600">LoRA 3</text><rect x="84" y="528" width="340" height="40" rx="7" fill="#10161e" stroke="#445060"/><text x="94" y="553" font-size="14" fill="#ffb9a4" >Missing: golden-hour.safetensors</text><path d="M402 545 l5 6 l5 -6" fill="none" stroke="#aeb8c6" stroke-width="1.6"/><text x="438" y="520" font-size="12" fill="#bdc8d8" font-weight="600">Model strength</text><rect x="438" y="528" width="150" height="42" rx="12" fill="#2b414f"/><text x="454" y="556" font-size="24" fill="#a4b0b7" >−</text><text x="482" y="555" font-size="16" fill="#f3f5f6" font-variant-numeric="tabular-nums">1.00</text><text x="564" y="556" font-size="24" fill="#a4b0b7" >+</text><text x="602" y="520" font-size="12" fill="#bdc8d8" font-weight="600">CLIP strength</text><rect x="602" y="528" width="150" height="42" rx="12" fill="#2b414f"/><text x="618" y="556" font-size="24" fill="#a4b0b7" >−</text><text x="646" y="555" font-size="16" fill="#f3f5f6" font-variant-numeric="tabular-nums">1.00</text><text x="728" y="556" font-size="24" fill="#a4b0b7" >+</text><g opacity="1"><rect x="768" y="528" width="34" height="40" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="785" y="553" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">↑</text></g><g opacity="0.4"><rect x="806" y="528" width="34" height="40" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="823" y="553" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">↓</text></g><g opacity="1"><rect x="844" y="528" width="34" height="40" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="861" y="553" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">×</text></g></g><g opacity="1"><rect x="30" y="592" width="118" height="38" rx="7" fill="#2b3441" stroke="#4d596a"/><text x="89" y="616" font-size="14" font-weight="600" text-anchor="middle" fill="#edf0f4">+ Add LoRA</text></g><text x="30" y="664" font-size="12" fill="#bdc8d8" font-weight="600">Notes</text><rect x="30" y="672" width="866" height="58" rx="7" fill="#10161e" stroke="#445060"/><text x="40" y="696" font-size="14" fill="#edf0f4" >Film look: pair with a photoreal checkpoint. Trigger words still go in your prompt.</text><text x="30" y="760" font-size="13" fill="#b6d4c8" >Changing the name saves a separate preset. Saving an existing name updates that preset.</text><line x1="30" y1="778" x2="910" y2="778" stroke="#3a4554"/><g opacity="1"><rect x="30" y="790" width="130" height="40" rx="7" fill="none" stroke="#4d596a"/><text x="95" y="815" font-size="14" font-weight="600" text-anchor="middle" fill="#ffb4b4">Delete preset</text></g><g opacity="1"><rect x="724" y="790" width="186" height="40" rx="7" fill="#9dd7c3" stroke="#9dd7c3"/><text x="817" y="815" font-size="14" font-weight="600" text-anchor="middle" fill="#142d26">Save &amp; use preset</text></g><g><circle cx="584" cy="130" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="584" y="135" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">1</text></g><g><circle cx="718" cy="130" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="718" y="135" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">2</text></g><g><circle cx="896" cy="206" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="896" y="211" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">3</text></g><g><circle cx="70" cy="346" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="70" y="351" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">4</text></g><g><circle cx="424" cy="342" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="424" y="347" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">5</text></g><g><circle cx="588" cy="342" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="588" y="347" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">6</text></g><g><circle cx="752" cy="342" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="752" y="347" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">7</text></g><g><circle cx="878" cy="342" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="878" y="347" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">8</text></g><g><circle cx="148" cy="590" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="148" y="595" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">9</text></g><g><circle cx="896" cy="670" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="896" y="675" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">10</text></g><g><circle cx="40" cy="752" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="40" y="757" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">11</text></g><g><circle cx="160" cy="788" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="160" y="793" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">12</text></g><g><circle cx="910" cy="788" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="910" y="793" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">13</text></g>
