<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">MODEL and CLIP wiring</title>
<desc id="d">Checkpoint MODEL and CLIP enter the LoRA Preset Loader. Its MODEL output goes to the KSampler and its CLIP output goes to both text encoders.</desc>
