<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">Strength control</title>
<desc id="d">Close-up of a strength control showing minus and plus buttons that step by 0.1 and a number that can be typed exactly.</desc>
<rect width="880" height="230" rx="14" fill="#1b2027"/><text x="30" y="44" font-size="18" fill="#edf0f4" font-weight="650">Strength control</text><text x="30" y="66" font-size="13" fill="#aeb8c6" >Every LoRA has one for MODEL and one for CLIP. They never affect each other.</text><rect x="30" y="92" width="220" height="56" rx="16" fill="#2b414f" stroke="#7fa8c0" stroke-width="2"/><text x="52" y="130" font-size="32" fill="#a4b0b7" >−</text><text x="106" y="128" font-size="24" fill="#f3f5f6" >0.75</text><text x="214" y="130" font-size="32" fill="#a4b0b7" >+</text><g stroke="#f2b84b" stroke-width="1.6" fill="none"><path d="M52 150 v28"/><path d="M128 150 v28"/><path d="M228 150 v28"/></g><g><circle cx="52" cy="190" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="52" y="195" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">1</text></g><g><circle cx="128" cy="190" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="128" y="195" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">2</text></g><g><circle cx="228" cy="190" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="228" y="195" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">3</text></g><g><circle cx="300" cy="96" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="300" y="101" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">1</text></g><text x="322" y="100" font-size="14" fill="#edf0f4" font-weight="650">− button</text><text x="414" y="100" font-size="13" fill="#aeb8c6" >Lower by exactly 0.1.</text><g><circle cx="300" cy="132" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="300" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">2</text></g><text x="322" y="136" font-size="14" fill="#edf0f4" font-weight="650">The number</text><text x="414" y="136" font-size="13" fill="#aeb8c6" >Click it and type any exact value, such as 0.75 or 0.125.</text><g><circle cx="300" cy="168" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="300" y="173" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">3</text></g><text x="322" y="172" font-size="14" fill="#edf0f4" font-weight="650">+ button</text><text x="414" y="172" font-size="13" fill="#aeb8c6" >Raise by exactly 0.1.</text><text x="300" y="214" font-size="12.5" fill="#aeb8c6" >↑ / ↓ keys step by 0.1 while the number is focused. Range −100 to 100; negative values are allowed.</text>
</svg>
