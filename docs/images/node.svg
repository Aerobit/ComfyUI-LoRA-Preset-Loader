<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">The LoRA Preset Loader node</title>
<desc id="d">Illustration of the node on the ComfyUI canvas with a model input, an optional clip input, MODEL and CLIP outputs, a preset dropdown and an Edit presets button.</desc>
<rect width="760" height="300" rx="14" fill="#1b2027"/><rect x="30" y="30" width="360" height="236" rx="10" fill="none"/><g transform="translate(60 56) scale(1.2)"><rect x="0" y="0" width="250" height="150" rx="8" fill="#353535" stroke="#6a6a6a"/><path d="M0 28 V8 a8 8 0 0 1 8 -8 H242 a8 8 0 0 1 8 8 V28 Z" fill="#222"/><text x="12" y="19" font-size="13" fill="#e6e6e6" font-weight="600">LoRA Preset Loader</text><circle cx="0" cy="46" r="5.5" fill="#B39DDB" stroke="#B39DDB" stroke-width="2"/><text x="12" y="50" font-size="12" fill="#cfcfcf" >model</text><circle cx="0" cy="68" r="5.5" fill="#FFD500" stroke="#FFD500" stroke-width="2"/><text x="12" y="72" font-size="12" fill="#cfcfcf" >clip (optional)</text><circle cx="250" cy="46" r="5.5" fill="#B39DDB"/><text x="238" y="50" font-size="12" fill="#cfcfcf" text-anchor="end">MODEL</text><circle cx="250" cy="68" r="5.5" fill="#FFD500"/><text x="238" y="72" font-size="12" fill="#cfcfcf" text-anchor="end">CLIP</text><rect x="10" y="86" width="230" height="24" rx="12" fill="#222" stroke="#555"/><text x="24" y="102" font-size="12" fill="#999" >preset</text><text x="226" y="102" font-size="12" fill="#e6e6e6" text-anchor="end">Cinematic</text><path d="M16 94 l-4 4 l4 4 M234 94 l4 4 l-4 4" fill="none" stroke="#999" stroke-width="1.4"/><rect x="10" y="114" width="230" height="24" rx="12" fill="#4a4a4a" stroke="#555"/><text x="125" y="130" font-size="12" fill="#e6e6e6" text-anchor="middle">Edit presets</text></g><g><circle cx="470" cy="58" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="470" y="63" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">1</text></g><text x="492" y="62" font-size="14" fill="#edf0f4" font-weight="650">model input</text><text x="492" y="80" font-size="12" fill="#aeb8c6" >Required. Connect the checkpoint's</text><text x="492" y="94" font-size="12" fill="#aeb8c6" >MODEL.</text><g><circle cx="470" cy="104" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="470" y="109" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">2</text></g><text x="492" y="108" font-size="14" fill="#edf0f4" font-weight="650">clip input</text><text x="492" y="126" font-size="12" fill="#aeb8c6" >Optional. Connect CLIP to apply CLIP</text><text x="492" y="140" font-size="12" fill="#aeb8c6" >strengths.</text><g><circle cx="470" cy="150" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="470" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">3</text></g><text x="492" y="154" font-size="14" fill="#edf0f4" font-weight="650">preset</text><text x="492" y="172" font-size="12" fill="#aeb8c6" >Pick a saved style. “(No preset —</text><text x="492" y="186" font-size="12" fill="#aeb8c6" >bypass)” passes inputs through.</text><g><circle cx="470" cy="196" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="470" y="201" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">4</text></g><text x="492" y="200" font-size="14" fill="#edf0f4" font-weight="650">Edit presets</text><text x="492" y="218" font-size="12" fill="#aeb8c6" >Opens the editor to create and change</text><text x="492" y="232" font-size="12" fill="#aeb8c6" >presets.</text><g><circle cx="470" cy="242" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="470" y="247" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">5</text></g><text x="492" y="246" font-size="14" fill="#edf0f4" font-weight="650">outputs</text><text x="492" y="264" font-size="12" fill="#aeb8c6" >MODEL, plus CLIP when the clip input</text><text x="492" y="278" font-size="12" fill="#aeb8c6" >is connected.</text><g><circle cx="44" cy="111" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="44" y="116" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">1</text></g><g><circle cx="44" cy="138" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="44" y="143" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">2</text></g><g><circle cx="56" cy="170" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="56" y="175" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">3</text></g><g><circle cx="56" cy="205" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="56" y="210" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">4</text></g><g><circle cx="372" cy="130" r="12" fill="#f2b84b" stroke="#1b2027" stroke-width="2"/><text x="372" y="135" font-size="13" font-weight="700" text-anchor="middle" fill="#2a1d00">5</text></g>
</svg>
