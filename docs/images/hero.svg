<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">LoRA Preset Loader</title>
<desc id="d">Banner showing the project name, its tagline and the node.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10161e"/><stop offset="1" stop-color="#22303a"/></linearGradient></defs><rect width="1200" height="320" rx="18" fill="url(#g)"/><text x="60" y="120" font-size="52" fill="#f3f5f6" font-weight="700">LoRA Preset Loader</text><text x="60" y="164" font-size="22" fill="#b9c7d6" >Save a style once. Choose it whenever you need it.</text><text x="60" y="196" font-size="16" fill="#8fa0b2" >Named, ordered LoRA stacks for ComfyUI, applied from a single node.</text><rect x="60" y="232" width="96" height="34" rx="17" fill="#2b3441" stroke="#4d596a"/><text x="108" y="254" font-size="14" fill="#d5f0e6" font-weight="600" text-anchor="middle">One node</text><rect x="166" y="232" width="220" height="34" rx="17" fill="#2b3441" stroke="#4d596a"/><text x="276" y="254" font-size="14" fill="#d5f0e6" font-weight="600" text-anchor="middle">Model + CLIP strengths</text><rect x="396" y="232" width="154" height="34" rx="17" fill="#2b3441" stroke="#4d596a"/><text x="473" y="254" font-size="14" fill="#d5f0e6" font-weight="600" text-anchor="middle">Shared presets</text><rect x="560" y="232" width="160" height="34" rx="17" fill="#2b3441" stroke="#4d596a"/><text x="640" y="254" font-size="14" fill="#d5f0e6" font-weight="600" text-anchor="middle">No dependencies</text><g transform="translate(790 40) scale(1.55)"><rect x="0" y="0" width="250" height="150" rx="8" fill="#353535" stroke="#6a6a6a"/><path d="M0 28 V8 a8 8 0 0 1 8 -8 H242 a8 8 0 0 1 8 8 V28 Z" fill="#222"/><text x="12" y="19" font-size="13" fill="#e6e6e6" font-weight="600">LoRA Preset Loader</text><circle cx="0" cy="46" r="5.5" fill="#B39DDB" stroke="#B39DDB" stroke-width="2"/><text x="12" y="50" font-size="12" fill="#cfcfcf" >model</text><circle cx="0" cy="68" r="5.5" fill="#FFD500" stroke="#FFD500" stroke-width="2"/><text x="12" y="72" font-size="12" fill="#cfcfcf" >clip (optional)</text><circle cx="250" cy="46" r="5.5" fill="#B39DDB"/><text x="238" y="50" font-size="12" fill="#cfcfcf" text-anchor="end">MODEL</text><circle cx="250" cy="68" r="5.5" fill="#FFD500"/><text x="238" y="72" font-size="12" fill="#cfcfcf" text-anchor="end">CLIP</text><rect x="10" y="86" width="230" height="24" rx="12" fill="#222" stroke="#555"/><text x="24" y="102" font-size="12" fill="#999" >preset</text><text x="226" y="102" font-size="12" fill="#e6e6e6" text-anchor="end">Cinematic</text><path d="M16 94 l-4 4 l4 4 M234 94 l4 4 l-4 4" fill="none" stroke="#999" stroke-width="1.4"/><rect x="10" y="114" width="230" height="24" rx="12" fill="#4a4a4a" stroke="#555"/><text x="125" y="130" font-size="12" fill="#e6e6e6" text-anchor="middle">Edit presets</text></g>
</svg>
